providers:
  - id: docling
    version: "1.32"
    transport: http
    endpoint: ${DOCLING_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - document.structure.extract
    media_types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - image/png
      - image/jpeg
      - image/tiff
    config:
      # TableFormer mode ("fast" | "accurate"); overridable per request via
      # the "table_mode" parameter. "pipeline: vlm" switches to Granite Vision.
      table_mode: accurate

  - id: docling-layout
    version: "1.32"
    transport: http
    endpoint: ${DOCLING_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - document.layout.analyze
    media_types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - image/png
      - image/jpeg
      - image/tiff

  - id: pymupdf-pdf
    version: "1.24"
    transport: in_process
    capabilities:
      - pdf.split
      - pdf.render
      - document.text.spans
    media_types:
      - application/pdf
      # pdf.render@2 also renders raster inputs.
      - image/png
      - image/jpeg

  - id: nougat
    version: "0.1.17"
    transport: http
    endpoint: ${NOUGAT_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - document.structure.extract
    media_types:
      - application/pdf

  - id: docling-math
    version: "1.32"
    transport: http
    endpoint: ${DOCLING_SERVE_URL}
    health_path: /health
    timeout_seconds: 300
    capabilities:
      - math.recognize
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
  - id: rapid-latex-ocr
    version: "0.1"
    transport: http
    endpoint: ${RAPID_LATEX_OCR_URL:-http://rapid-latex-ocr:5004}
    health_path: /health
    timeout_seconds: 60
    capabilities:
      - math.recognize
    media_types:
      - image/png
      - image/jpeg
      - image/tiff

  # PP-FormulaNet_plus-M: PaddleOCR's formula recognition model on CPU. More
  # accurate than rapid-latex-ocr on matrices and vector notation; heavier to
  # start (the Paddle runtime loads the weights into memory).
  - id: pp-formulanet
    version: "1.0"
    transport: http
    endpoint: ${PP_FORMULANET_URL:-http://pp-formulanet:5010}
    health_path: /health
    timeout_seconds: 300
    capabilities:
      - math.recognize
    media_types:
      - image/png
      - image/jpeg
      - image/tiff

  - id: rapidocr-orient
    version: "1.0"
    transport: http
    endpoint: ${RAPIDOCR_ORIENT_URL:-http://rapidocr-orient:5006}
    health_path: /health
    timeout_seconds: 30
    capabilities:
      - image.page.orient
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
      - image/webp

  # Pandoc + TeX Live sidecar for tagged PDF/UA export. The toolchain is pinned
  # in docker/pdf-ua-render.Dockerfile; its versions and the template digest are
  # reported by /version and therefore part of the cache key.
  - id: pandoc-pdf-ua
    version: "1.0"
    transport: http
    endpoint: ${PDF_UA_RENDER_URL:-http://pdf-ua-render:5007}
    health_path: /health
    timeout_seconds: 180
    capabilities:
      - document.export.pdf_ua
    media_types:
      - application/json

  # DOCX export on the same sidecar: it reuses the pinned Pandoc, without TeX.
  # Pandoc runs with --sandbox, so the AST cannot make it read local files.
  - id: pandoc-docx
    version: "1.0"
    transport: http
    endpoint: ${PDF_UA_RENDER_URL:-http://pdf-ua-render:5007}
    health_path: /health
    timeout_seconds: 180
    capabilities:
      - document.export.docx
    media_types:
      - application/json

  # veraPDF sidecar for PDF/UA validation. The release is pinned in
  # docker/verapdf-validate.Dockerfile and reported by /version, so it is part
  # of the cache key.
  - id: verapdf
    version: "1.0"
    transport: http
    endpoint: ${VERAPDF_VALIDATE_URL:-http://verapdf-validate:5008}
    health_path: /health
    timeout_seconds: 300
    capabilities:
      - pdf.validate.pdf_ua
    media_types:
      - application/pdf

  # Vision-language model behind an OpenAI-compatible chat server (llama.cpp
  # llama-server on VM2 in production; vLLM works the same way). Serves the
  # Dr.DocBench VLM capabilities; the adapter returns model evidence and the
  # agentic core decides. The version names the served weights and is part of
  # the cache key: bump it whenever the server loads a different model.
  # Reach the server over the internal network; VLM_API_KEY is sent as a Bearer
  # token when set (llama-server --api-key).
  - id: qwen3-vl-8b
    version: "qwen3-vl-8b-instruct-q4_k_m-f982a07"
    transport: http
    endpoint: ${VLM_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - document.ocr.page
      - document.adjudicate.page
      - document.adjudicate.region
      - table.recognize
    media_types:
      - image/png
      - image/jpeg
    config:
      model: qwen3-vl-8b
      api_key: ${VLM_API_KEY:-}
      # llama-server runs 4 parallel slots of 8192 tokens each.
      max_concurrency: 4
      page_max_tokens: 4096
      # Two candidates plus the page image must fit in one 8192-token slot.
      judge_max_chars: 6000
      # vlm_page_ocr.py used repetition_penalty 1.05 (vLLM); llama-server calls
      # it repeat_penalty.
      page_sampling:
        repeat_penalty: 1.05
      # vlm_tables.py used 6000 output tokens and 6000-character hints with a
      # 16k context; halved to fit one 8192-token slot with the crop.
      table_max_tokens: 3072
      table_hint_chars: 3000

  - id: docling-ocr
    version: "1.32"
    transport: http
    endpoint: ${DOCLING_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - document.ocr
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
      - application/pdf

  - id: mineru
    version: "2.1"
    transport: http
    endpoint: ${MINERU_SERVE_URL}
    health_path: /openapi.json
    timeout_seconds: 600
    capabilities:
      - document.structure.extract
    media_types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/tiff

  - id: mineru-layout
    version: "2.1"
    transport: http
    endpoint: ${MINERU_SERVE_URL}
    health_path: /openapi.json
    timeout_seconds: 600
    capabilities:
      - document.layout.analyze
    media_types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/tiff

  - id: mineru-ocr
    version: "2.1"
    transport: http
    endpoint: ${MINERU_SERVE_URL}
    health_path: /openapi.json
    timeout_seconds: 600
    capabilities:
      - document.ocr
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
      - application/pdf

  - id: pure-code
    version: "1.0"
    transport: in_process
    capabilities:
      - code.normalize
    media_types:
      - text/plain

  - id: pure-text
    version: "1.0"
    transport: in_process
    capabilities:
      - text.postprocess
    media_types:
      - application/json

  - id: pure-media-inspect
    version: "1.1"
    transport: in_process
    capabilities:
      - media.inspect
    media_types:
      - image/png
      - image/jpeg
      - image/webp
      - image/tiff
      - image/bmp
      - application/pdf

  - id: pure-accessibility
    version: "1.0"
    transport: in_process
    capabilities:
      - accessibility.mark
    media_types:
      - application/json

  # math-speech sidecar: MathJax converts LaTeX to MathML and MathCAT speaks it
  # in pt-BR. MathJax and the MathCAT commit are pinned in
  # docker/math-speech.Dockerfile and reported by /version, so they are part of
  # the cache key. mathml-to-latex runs in-process in the adapter.
  - id: math-speech
    version: "1.0"
    transport: http
    endpoint: ${MATH_SPEECH_URL:-http://math-speech:5009}
    health_path: /health
    timeout_seconds: 30
    capabilities:
      - math.convert
      - math.verbalize
    media_types:
      - application/json
      - text/plain

  - id: pure-chem
    version: "1.0"
    transport: in_process
    capabilities:
      - chem.convert
    media_types:
      - application/json
      - text/plain

  - id: docling-chem
    version: "1.32"
    transport: http
    endpoint: ${DOCLING_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - chem.recognize
    media_types:
      - image/png
      - image/jpeg
      - image/tiff

  - id: homr
    version: "0.1"
    transport: in_process
    capabilities:
      - music.omr
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
      - application/pdf

  - id: audiveris
    version: "0.1"
    transport: http
    endpoint: ${AUDIVERIS_SERVE_URL}
    health_path: /health
    timeout_seconds: 600
    capabilities:
      - music.omr
    media_types:
      - image/png
      - image/jpeg
      - image/tiff
      - application/pdf

  - id: minio
    version: "2025.04"
    transport: s3
    endpoint: ${MINIO_URL}
    capabilities:
      - artifact.store
      - artifact.retrieve
    config:
      bucket: acessilia
      access_key: ${MINIO_ACCESS_KEY}
      secret_key: ${MINIO_SECRET_KEY}

  # Explicit local-development alternative, used only when no S3 store is
  # configured. Never selected as a backup for unavailable or misconfigured S3.
  - id: filesystem
    version: "1.0"
    transport: in_process
    capabilities:
      - artifact.store
      - artifact.retrieve
    config:
      root: /tmp/acessilia-toolbox-artifacts

  - id: valkey
    version: "8"
    transport: redis
    endpoint: ${VALKEY_URL}
    capabilities:
      - cache.get
      - cache.put

  - id: dataset-github
    version: "1.0"
    transport: in_process
    capabilities:
      - dataset.list
      - dataset.describe
      - dataset.list_splits
      - dataset.list_items
      - dataset.get_item
      - dataset.get_artifact
      - dataset.sample
      - dataset.sync
    config:
      mirror: false

  - id: dataset-huggingface
    version: "1.0"
    transport: in_process
    capabilities:
      - dataset.list
      - dataset.describe
      - dataset.list_splits
      - dataset.list_items
      - dataset.get_item
      - dataset.get_artifact
      - dataset.sample
      - dataset.sync
    config:
      mirror: true
      db: 0
      ttl_seconds: 604800

