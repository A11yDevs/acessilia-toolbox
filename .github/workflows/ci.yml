name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # During BHS a release branch only takes bug fixes (CONTRIBUTING.md, 5.1);
  # features, improvements and refactorings keep going to develop.
  release-scope:
    name: release accepts only fixes
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject branches that are not fixes
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            fix/*|hotfix/*) echo "${HEAD_REF} -> ${BASE_REF}: ok" ;;
            *)
              echo "::error::${BASE_REF} only accepts fix/* and hotfix/* branches during BHS; target develop with ${HEAD_REF}."
              exit 1
              ;;
          esac

  tests:
    name: tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            .venv
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            poppler-utils

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: python -m mypy src/

      - name: Run tests
        run: python -m pytest tests/unit/ -v --junitxml=test-results.xml

      - name: Test artifact failover and replica replacement
        run: >-
          python -m pytest tests/integration/test_artifact_failover.py
          tests/statelessness/ -v --junitxml=artifact-test-results.xml

      - name: Reject unexpected skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for report in (Path("test-results.xml"), Path("artifact-test-results.xml"))
              for root in (ElementTree.parse(report).getroot(),)
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(
                  f"CI incompleto: {skipped} teste(s) foram pulado(s). "
                  "Consulte os motivos exibidos pelo pytest."
              )
          print("Relatorio JUnit validado: nenhum teste foi pulado.")
          PY
