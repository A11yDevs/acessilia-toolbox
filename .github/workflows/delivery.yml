name: Delivery

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: a11ydevs/acessilia-toolbox

jobs:
  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LOCAL_IMAGE: acessilia-toolbox:delivery

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          # Docker tags nao aceitam "/" (ex: release/0.0.1 -> release-0.0.1)
          SAFE_BRANCH="${BRANCH//\//-}"

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SAFE_BRANCH}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${SHA:0:7}"

          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Build production image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            TOOLBOX_EXTRAS=api,storage,cache
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Verify installed packages
        run: |
          docker run --rm --interactive "$LOCAL_IMAGE" \
            python - <<'PY'
          from importlib.metadata import distributions
          installed = {
              distribution.metadata["Name"].lower().replace("_", "-")
              for distribution in distributions()
              if distribution.metadata["Name"]
          }
          # The toolbox image must NOT carry ML runtimes
          forbidden = {"docling", "rapidocr", "torch", "torchvision", "triton"}
          unexpected = forbidden & installed
          unexpected |= {name for name in installed if name.startswith("nvidia-")}
          if unexpected:
              raise SystemExit(f"Pacotes inesperados na imagem: {unexpected}")
          print("Pacotes validados: nenhum runtime ML na imagem.")
          PY

      - name: Smoke test API health
        run: |
          container_id=$(docker run --detach --rm \
            --publish 127.0.0.1::8002 \
            "$LOCAL_IMAGE")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 8002/tcp | awk -F: '{print $NF}')
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-connrefused --retry-delay 2 \
            "http://127.0.0.1:${port}/v1/health"

      - name: Enforce local image size guardrail
        run: python scripts/check_image_size.py local "$LOCAL_IMAGE" --limit-gb 1

      - name: Publish verified production image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=acessilia-toolbox
            org.opencontainers.image.description=Stateless capability gateway for agentic systems
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            TOOLBOX_EXTRAS=api,storage,cache
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=production

      - name: Enforce published image size guardrail
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python scripts/check_image_size.py remote \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --limit-gb 1 | tee image-size.txt
          {
            echo "### toolbox image"
            echo '```text'
            cat image-size.txt
            echo '```'
            echo "digest=${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"