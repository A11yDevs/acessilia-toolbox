# docker-compose.staging.yml — Acessilia Toolbox staging environment.
#
# Uses a pre-published GHCR image. The container is automatically updated
# by the scripts/staging-update.sh script triggered by a systemd user timer.
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml logs -f
#
# To track a specific branch (e.g. during BHS):
#   TRACK_BRANCH=release/0.1.0 docker compose -f docker-compose.staging.yml up -d

services:
  # ── Toolbox ──────────────────────────────────────────────────────
  toolbox:
    image: ghcr.io/a11ydevs/acessilia-toolbox:${TRACK_TAG:-develop}
    container_name: acessilia-toolbox-staging
    ports:
      - "${TOOLBOX_PORT:-8002}:8002"
    environment:
      TOOLBOX_PORT: 8002
      TOOLBOX_PROVIDERS_CONFIG: /app/providers-config.yaml
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling-serve:5001}
      MINERU_SERVE_URL: ${MINERU_SERVE_URL:-http://mineru-serve:5002}
      NOUGAT_SERVE_URL: ${NOUGAT_SERVE_URL:-http://nougat-serve:5004}
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      TOOLBOX_API_KEY: ${TOOLBOX_API_KEY}
      AUDIVERIS_SERVE_URL: ${AUDIVERIS_SERVE_URL:-http://audiveris-serve:5003}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Providers ────────────────────────────────────────────────────
  docling-serve:
    image: ${DOCLING_SERVE_IMAGE:-ghcr.io/docling-project/docling-serve-cpu:v1.32.0}
    container_name: docling-serve-staging
    ports:
      - "${DOCLING_SERVE_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "${DOCLING_SERVE_ENABLE_UI:-false}"
    volumes:
      - docling-models:/root/.cache/docling
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # MinerU document parsing (CPU pipeline backend). The image is built from
  # the official repo via scripts/build-mineru-image.sh (MinerU publishes no
  # pre-built images). On a GPU host, build with the vllm base and add
  # `deploy.resources.reservations.devices` for GPU access.
  mineru-serve:
    image: ${MINERU_SERVE_IMAGE:-mineru:latest}
    container_name: mineru-serve-staging
    entrypoint: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MINERU_SERVE_PORT:-5002}:8000"
    environment:
      MINERU_DEVICE_MODE: ${MINERU_DEVICE_MODE:-cpu}
    volumes:
      - mineru-models:/home/mineru/.cache/modelscope
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # Audiveris optical music recognition sidecar (optional). Wraps the Java
  # Audiveris CLI + Tesseract behind a small FastAPI HTTP wrapper
  # (POST /convert multipart -> MusicXML). Build the image from the
  # audiveris-serve recipe before enabling.
  audiveris-serve:
    image: ${AUDIVERIS_SERVE_IMAGE:-audiveris-serve:latest}
    container_name: audiveris-serve-staging
    ports:
      - "${AUDIVERIS_SERVE_PORT:-5003}:5003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Nougat visual document transcription service (LaTeX math/tables).
  # Built from docker/nougat-cpu.Dockerfile via scripts/build-nougat-image.sh.
  nougat-serve:
    image: ${NOUGAT_SERVE_IMAGE:-nougat:latest}
    container_name: nougat-serve-staging
    ports:
      - "${NOUGAT_SERVE_PORT:-5004}:5004"
    volumes:
      - nougat-models:/root/.cache/torch/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: acessilia-minio-staging
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    container_name: acessilia-valkey-staging
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

      # ── One-shot bucket init ──────────────────────────────────────
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: acessilia-minio-init-staging
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}
        mc mb local/acessilia --ignore-existing
        echo "✅ Bucket acessilia criado/verificado"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  docling-models:
  mineru-models:
  minio-data:
  nougat-models:
  valkey-data: