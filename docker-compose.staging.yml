# docker-compose.staging.yml — Acessilia Toolbox staging environment.
#
# Uses images pre-published on GHCR: the toolbox image (Delivery workflow) and
# one image per sidecar (Sidecars workflow), all tagged with the tracked branch.
# scripts/staging-update.sh, triggered by a systemd user timer, updates the
# toolbox and its sidecars together once the images of a new commit exist.
# Set a *_IMAGE variable only to run a locally built sidecar instead.
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml logs -f
#
# To track a specific branch (e.g. during BHS):
#   TRACK_BRANCH=release/0.1.0 docker compose -f docker-compose.staging.yml up -d

services:
  # ── Toolbox ──────────────────────────────────────────────────────
  toolbox:
    image: ghcr.io/a11ydevs/acessilia-toolbox:${TRACK_TAG:-develop}
    container_name: acessilia-toolbox-staging
    ports:
      - "${TOOLBOX_PORT:-8002}:8002"
    environment:
      TOOLBOX_PORT: 8002
      TOOLBOX_PROVIDERS_CONFIG: /app/providers-config.yaml
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://docling-serve:5001}
      # mineru-api listens on 8000 inside its container; MINERU_SERVE_PORT only
      # maps that port on the host, so the service-to-service URL must use 8000.
      MINERU_SERVE_URL: ${MINERU_SERVE_URL:-http://mineru-serve:8000}
      NOUGAT_SERVE_URL: ${NOUGAT_SERVE_URL:-http://nougat-serve:5004}
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      TOOLBOX_API_KEY: ${TOOLBOX_API_KEY}
      AUDIVERIS_SERVE_URL: ${AUDIVERIS_SERVE_URL:-http://audiveris-serve:5003}
      RAPID_LATEX_OCR_URL: ${RAPID_LATEX_OCR_URL:-http://rapid-latex-ocr:5004}
      RAPIDOCR_ORIENT_URL: ${RAPIDOCR_ORIENT_URL:-http://rapidocr-orient:5006}
      PDF_UA_RENDER_URL: ${PDF_UA_RENDER_URL:-http://pdf-ua-render:5007}
      VERAPDF_VALIDATE_URL: ${VERAPDF_VALIDATE_URL:-http://verapdf-validate:5008}
      MATH_SPEECH_URL: ${MATH_SPEECH_URL:-http://math-speech:5009}
      VLM_SERVE_URL: ${VLM_SERVE_URL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
    env_file:
      - .env
    volumes:
      - ${ARTIFACT_FALLBACK_SOURCE:-artifact-fallback}:/tmp/acessilia-toolbox-artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Providers ────────────────────────────────────────────────────
  docling-serve:
    image: ${DOCLING_SERVE_IMAGE:-ghcr.io/docling-project/docling-serve-cpu:v1.32.0}
    container_name: docling-serve-staging
    ports:
      - "${DOCLING_SERVE_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "${DOCLING_SERVE_ENABLE_UI:-false}"
      # The image caches models under /opt/app-root/src/.cache/docling/models
      # (its own DOCLING_SERVE_ARTIFACTS_PATH default), not under /root/.cache.
      # Mounting the volume at the wrong path leaves it permanently empty, so
      # every container start re-downloads the models.
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
    volumes:
      - docling-models:/opt/app-root/src/.cache/docling
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # MinerU document parsing (CPU pipeline backend), built by CI from
  # docker/mineru-cpu.Dockerfile (MinerU publishes no pre-built images). On a
  # GPU host, build with scripts/build-mineru-image.sh (vllm variant), set
  # MINERU_SERVE_IMAGE and add `deploy.resources.reservations.devices`.
  mineru-serve:
    image: ${MINERU_SERVE_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-mineru:${TRACK_TAG:-develop}}
    container_name: mineru-serve-staging
    entrypoint: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MINERU_SERVE_PORT:-5002}:8000"
    environment:
      MINERU_DEVICE_MODE: ${MINERU_DEVICE_MODE:-cpu}
    volumes:
      - mineru-models:/home/mineru/.cache/modelscope
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # Audiveris optical music recognition sidecar (optional). Wraps the Java
  # Audiveris CLI + Tesseract behind a small FastAPI HTTP wrapper
  # (POST /convert multipart -> MusicXML). Built by CI from
  # docker/audiveris-serve.Dockerfile.
  audiveris-serve:
    image: ${AUDIVERIS_SERVE_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-audiveris-serve:${TRACK_TAG:-develop}}
    container_name: audiveris-serve-staging
    ports:
      - "${AUDIVERIS_SERVE_PORT:-5003}:5003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Nougat visual document transcription service (LaTeX math/tables).
  # Built by CI from docker/nougat-cpu.Dockerfile.
  nougat-serve:
    image: ${NOUGAT_SERVE_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-nougat:${TRACK_TAG:-develop}}
    container_name: nougat-serve-staging
    ports:
      - "${NOUGAT_SERVE_PORT:-5004}:5004"
    volumes:
      - nougat-torch-models:/root/.cache/torch/hub
      - nougat-models:/root/.cache/nougat
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # RapidLaTeXOCR math formula sidecar (optional). Built by CI from
  # docker/math-ocr.Dockerfile; the Toolbox reaches it through
  # RAPID_LATEX_OCR_URL.
  rapid-latex-ocr:
    image: ${RAPID_LATEX_OCR_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-rapid-latex-ocr:${TRACK_TAG:-develop}}
    container_name: rapid-latex-ocr-staging
    ports:
      - "${RAPID_LATEX_OCR_PORT:-5005}:5004"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # RapidOCR page orientation sidecar (optional). Built by CI from
  # docker/rapidocr-orient.Dockerfile; reports 503 until the engine is ready.
  rapidocr-orient:
    image: ${RAPIDOCR_ORIENT_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-rapidocr-orient:${TRACK_TAG:-develop}}
    container_name: rapidocr-orient-staging
    ports:
      - "${RAPIDOCR_ORIENT_PORT:-5006}:5006"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Pandoc + TeX Live sidecar (optional) for document.export.pdf_ua and
  # document.export.docx. Built by CI from docker/pdf-ua-render.Dockerfile; /health
  # reports 503 until pandoc, TeX and the template are found, for both routes.
  pdf-ua-render:
    image: ${PDF_UA_RENDER_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-pdf-ua-render:${TRACK_TAG:-develop}}
    container_name: pdf-ua-render-staging
    ports:
      - "${PDF_UA_RENDER_PORT:-5007}:5007"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5007/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # PDF/UA validation sidecar (optional). Built by CI from
  # docker/verapdf-validate.Dockerfile; reports 503 until veraPDF is found.
  verapdf-validate:
    image: ${VERAPDF_VALIDATE_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-verapdf-validate:${TRACK_TAG:-develop}}
    container_name: verapdf-validate-staging
    ports:
      - "${VERAPDF_VALIDATE_PORT:-5008}:5008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Math speech sidecar (optional) for math.convert and math.verbalize: MathJax
  # converts LaTeX to MathML and MathCAT speaks it in pt-BR and writes math
  # braille. Built by CI from docker/math-speech.Dockerfile.
  math-speech:
    image: ${MATH_SPEECH_IMAGE:-ghcr.io/a11ydevs/acessilia-toolbox-math-speech:${TRACK_TAG:-develop}}
    container_name: math-speech-staging
    ports:
      - "${MATH_SPEECH_PORT:-5009}:5009"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5009/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034}
    container_name: acessilia-minio-staging
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    container_name: acessilia-valkey-staging
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

      # ── One-shot bucket init ──────────────────────────────────────
  minio-init:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034}
    container_name: acessilia-minio-init-staging
    entrypoint:
      - sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb local/acessilia --ignore-existing
        echo "Bucket acessilia created/verified"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  artifact-fallback:
  docling-models:
  mineru-models:
  minio-data:
  nougat-models:
  nougat-torch-models:
  valkey-data:
