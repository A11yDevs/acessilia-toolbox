# MathCAT compiled to WebAssembly for the math-speech sidecar (Node.js target).
#
# MathCAT is pinned by commit: its rules decide the spoken text, so /version
# reports the commit and it enters the Toolbox cache key. The pt rules are the
# Brazilian Portuguese translation (MathCAT #736). Only the languages and
# braille codes below are embedded; en is always embedded as MathCAT's fallback.

[package]
name = "mathcat-wasm"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mathcat = { git = "https://github.com/NSoiffer/MathCAT", rev = "95892aba39d1660f41794dd0579f154da960bcf5", default-features = false, features = ["include-zip", "lang-en", "lang-pt", "braille-cmu", "braille-nemeth", "braille-ueb"] }
# Must match the wasm-bindgen-cli version in docker/math-speech.Dockerfile.
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
opt-level = "s"
