id: document.layout.analyze
version: 1
description: >-
  Extract and classify the visual layout regions of a document page.
  Version 1 preserves compact pages/regions (docling-layout) or a canonical
  processing manifest with extractor.configuration.layout_regions
  (mineru-layout); artifact/layout-analysis@1 describes both representations.
  A compact region's bbox is [left, top, right, bottom] in page points with a
  top-left origin (y grows downwards); unresolved boxes are omitted. For a
  processing manifest, interpret geometry using canonical element provenance
  and its explicit coordinate origin.

input:
  schema: artifact/document@1
  media_types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - image/png
    - image/jpeg
    - image/tiff

output:
  schema: artifact/layout-analysis@1
  media_types:
    - application/json

execution:
  deterministic: true
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 600

semantics:
  requires:
    - document_available
  produces:
    - layout_available
    - regions_classified

providers:
  - id: docling-layout
    version: "1.32+"
  - id: mineru-layout
    version: "4.0.12+"
