id: chem.convert
version: 1
description: >-
  Normalize a LaTeX mhchem expression (\ce{...}) into a structured chemical
  formula or reaction with a human-readable textual rendering.

input:
  schema: artifact/latex@1
  media_types:
    - application/json
    - text/plain

output:
  schema: artifact/mhchem@1
  media_types:
    - application/json

execution:
  deterministic: true
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 30

semantics:
  requires:
    - math_recognized
  produces:
    - chemistry_normalized

providers:
  - id: pure-chem
    version: "1.0+"
