id: document.adjudicate.page
version: 1
description: >-
  Pairwise judge: given a page image and two candidate transcriptions, return
  the probability that the second candidate is the more faithful one. Both
  candidate orders are asked and averaged to cancel position bias. The caller
  decides what to do with the probability.

input:
  schema: artifact/image@1
  media_types:
    - image/png
    - image/jpeg

output:
  schema: artifact/page-judgement@1
  media_types:
    - application/json

execution:
  deterministic: false
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 300

semantics:
  requires:
    - image_readable
    - candidate_transcriptions_available
  produces:
    - page_adjudicated

providers:
  - id: qwen3-vl-8b
