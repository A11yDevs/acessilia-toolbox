id: document.structure.extract
version: 1
description: >-
  Extract the logical and visual structure of a document and normalize it into
  the canonical Acessilia structured document.

input:
  schema: artifact/document@1
  media_types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - image/png
    - image/jpeg
    - image/tiff

output:
  schema: artifact/structured-document@1
  media_types:
    - application/json

execution:
  deterministic: true
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 600

semantics:
  requires:
    - document_available
  produces:
    - structured
    - has_ast
    - text_available

providers:
  - id: docling
    version: "1.32+"
