id: music.omr
version: 1
description: >-
  Recognize sheet music from images or PDFs and convert it to MusicXML or
  MEI notation (optical music recognition).

input:
  schema: artifact/image@1
  media_types:
    - image/png
    - image/jpeg
    - image/tiff
    - application/pdf

output:
  schema: artifact/music-score@1
  media_types:
    - application/json

execution:
  deterministic: false
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 600

semantics:
  requires:
    - image_readable
  produces:
    - music_score_available

providers:
  - id: homr
    version: "0.1+"
  - id: audiveris
    version: "0.1+"
