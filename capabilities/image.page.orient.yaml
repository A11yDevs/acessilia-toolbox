id: image.page.orient
version: 1
description: >-
  Detect page orientation (0°, 90°, 180°, 270°) and optionally rotate raster page
  images to upright orientation.

input:
  schema: artifact/document@1
  media_types:
    - image/png
    - image/jpeg
    - image/tiff
    - image/webp

output:
  schema: artifact/document@1
  media_types:
    - application/json

execution:
  deterministic: true
  idempotent: true
  cacheable: true
  timeout_hint_seconds: 30

semantics:
  requires:
    - image_available
  produces:
    - page_upright
    - orientation_detected

providers:
  - id: rapidocr-orient
    version: "1.0+"
